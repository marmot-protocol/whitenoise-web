version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node types follow the Node 22 runtime declared in package.json, CI and Vercel.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
