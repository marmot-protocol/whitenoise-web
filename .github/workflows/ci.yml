name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        # Two advisories have no patched release, so no upgrade or override
        # clears them: deepmerge (GHSA-gcqx-w48m-w2h4, 4.3.1 is the newest and
        # last affected version) through @sveltejs/vite-plugin-svelte, and
        # picomatch (GHSA-fc5q-39xc-vjpf, every release up to 4.0.7, the newest)
        # through build and test tooling that only matches globs from project
        # config. Ignore them by ID rather than lowering the severity threshold,
        # so every advisory outside this list, low included, still fails the
        # build. Drop each flag once a fix exists.
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-fc5q-39xc-vjpf

      - name: Run CI checks
        # Vercel sets this for the project and the plan cannot turn it off; build the same way.
        env:
          VERCEL_SKEW_PROTECTION_ENABLED: "1"
        run: bun run ci
