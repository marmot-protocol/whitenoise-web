name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        # deepmerge, reached through @sveltejs/vite-plugin-svelte, has no patched
        # release: 4.3.1 is both the newest version and the last affected one, so
        # no upgrade or override clears it. Ignore that one advisory by ID rather
        # than lowering the severity threshold, so every other advisory, low
        # included, still fails the build. Drop the flag once a fix exists.
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4

      - name: Run CI checks
        run: bun run ci
